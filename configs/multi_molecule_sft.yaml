seed: 42

model:
  name: QizhiPei/biot5-plus-base
  tokenizer_name: QizhiPei/biot5-plus-base
  base_tokenizer_name: google/t5-v1_1-base
  selfies_vocab_path: molecules/dict/selfies_dict.txt
  molecule_separator_token: <mol_sep>

data:
  train_file: data/post_training/processed/train_multimol.jsonl
  validation_file: data/post_training/processed/validation_multimol.jsonl
  test_file: data/post_training/processed/test_multimol.jsonl
  max_source_length: 512
  max_target_length: 768
  max_molecules_per_sequence: 8
  num_workers: 2

training:
  output_dir: outputs/multi_molecule_sft
  device: auto
  mixed_precision: auto
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 3
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  log_every: 10
  save_every_epochs: 1
  num_beams: 1
  generation_max_new_tokens: 768
