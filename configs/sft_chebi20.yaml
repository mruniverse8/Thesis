seed: 42

tracking:
  enabled: true
  backend: wandb
  project: Thesis-1
  workspace: koala-team
  run_name:
  tags: []

model:
  name: QizhiPei/biot5-plus-base

data:
  train_file: data/chebi20/processed/train.jsonl
  validation_file: data/chebi20/processed/validation.jsonl
  test_file: data/chebi20/processed/test.jsonl
  max_source_length: 512
  max_target_length: 384
  num_workers: 2

training:
  output_dir: outputs/chebi20_sft
  device: auto
  mixed_precision: auto
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 3
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  log_every: 10
  save_every_epochs: 1
  num_beams: 1
  generation_max_new_tokens: 384
