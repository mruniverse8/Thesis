seed: 42

tracking:
  enabled: true
  backend: wandb
  project: Thesis-1
  workspace: koala-team
  run_name:
  tags: ["lpm24"]

model:
  name: QizhiPei/biot5-plus-base
  molecule_separator_token: " "

data:
  train_file: data/lpm24/grouped_splits/train_multimol.jsonl
  validation_file: data/lpm24/grouped_splits/validation_multimol.jsonl
  test_file: data/lpm24/grouped_splits/test_multimol.jsonl
  max_source_length: 512
  max_target_length: 1024
  max_molecules_per_sequence: 8
  num_workers: 0

training:
  output_dir: outputs/multi_molecule_sft_lpm24
  device: auto
  mixed_precision: auto
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  num_epochs: 3
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  log_every: 10
  save_every_epochs: 1
  num_beams: 1
  generation_max_new_tokens: 1024
