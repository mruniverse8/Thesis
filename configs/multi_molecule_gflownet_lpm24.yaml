seed: 42

tracking:
  enabled: true
  backend: wandb
  project: Thesis-2
  workspace: koala-team
  run_name:
  tags: ["lpm24"]

model:
  checkpoint: outputs/multi_molecule_sft_lpm24/checkpoints/best
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q", "v"]

data:
  train_file: data/lpm24/grouped_splits/train_multimol.jsonl
  validation_file: data/lpm24/grouped_splits/validation_multimol.jsonl
  test_file: data/lpm24/grouped_splits/test_multimol.jsonl
  max_source_length: 512

training:
  output_dir: outputs/multi_molecule_gflownet_lpm24
  device: auto
  save_every_iterations: 5

reward:
  fingerprint_radius: 2
  fingerprint_num_bits: 2048
  match_alpha: 0.5
  reward_variant: reward_var2
  plus_valid: 0.8
  diversity_beta: 1.0
  match_weight: 1.0
  diversity_weight: 1.0
  reward_amplification: 8.0
  duplicate_penalty_factor: 0.1
  penalty_invalid: 0.5
  invalid_similarity_ngram_size: 3
  acceptance_dice_threshold: 0.7
  acceptance_tanimoto_threshold: 0.6

gflownet:
  gflownet_iterations: 10
  batch_size: 2
  objective: tb
  learning_rate: 5.0e-7
  max_grad_norm: 1.0
  diagnostic_log_every_iterations: 5
  trajectory_preview_every_iterations: 5
  trajectory_preview_num_samples: 3
  trajectory_preview_max_chars: 480
  invalid_terminal_reward: 4.0e-2
  target_guidance:
    enabled: true
    on_policy_fraction: 0.25
    target_prefix_rollout_fraction: 0.50
    target_teacher_fraction: 0.25
  replay:
    enabled: false
    buffer_type: experimental_mixture
    capacity: 256
    replay_fraction: 0.75
    with_replacement: false
    recent_fraction: 0.40
    reward_fraction: 0.40
    uniform_fraction: 0.20
    tb_residual_fraction: 0.20
    reward_temperature: 1.0
    tb_residual_temperature: 1.0
    recent_window_size: 64
    max_invalid_fraction: 0.20
    max_duplicate_fraction: 0.10
  rollout:
    max_source_length: 512
    max_stage_new_tokens: 192
    max_molecules_per_sequence: 8
    max_sequence_length: 4096
    temperature: 0.08
    top_p: 0.25
    constrained_decoding: true
    append_probability: 0.30
    invalid_append_probability: 0.0
    stage_separator: " "
    selfies_dict_path: molecules/dict/selfies_dict.txt
    terminate_on_invalid_stage: true
